# Spectrum analyzer config for the francisco.eq panel.
# cava reads the monitor of the default output (the Equalizer sink) and writes
# one ASCII frame per line to stdout: 32 values from 0 to 100 separated by ";".
[general]
framerate = 60
bars = 32

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 28
